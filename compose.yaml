services:
  composer:
    build:
      context: .
      args:
        MCP_COMPOSER_VERSION: ${MCP_COMPOSER_VERSION:-0.1.0}
    image: mcp-composer:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MCP_COMPOSER_PORT:-8000}:8000"
    environment:
      APP_MODE: hosted
      FRONTEND_DIST_DIR: /app/frontend/dist
      MCP_COMPOSER_ALLOWED_ORIGINS: ${MCP_COMPOSER_ALLOWED_ORIGINS:-http://localhost:${MCP_COMPOSER_PORT:-8000},http://127.0.0.1:${MCP_COMPOSER_PORT:-8000}}
      MCP_COMPOSER_ALLOWED_HOSTS: ${MCP_COMPOSER_ALLOWED_HOSTS:-localhost,127.0.0.1}
      MCP_COMPOSER_REMOTE_HOSTS: ${MCP_COMPOSER_REMOTE_HOSTS:-}
      MCP_COMPOSER_DOCS_ENABLED: "false"
      MCP_COMPOSER_REQUIRE_ORIGIN: "true"
      MCP_COMPOSER_MAX_REQUEST_BYTES: "1000000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 20s
