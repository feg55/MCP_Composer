name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/feg55/mcp-composer

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate release tag and version file
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          version="${tag#v}"
          test "$(tr -d '[:space:]' < VERSION)" = "${version}"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check frontend
        working-directory: frontend
        run: |
          npm ci
          npm run check

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.in
            backend/requirements-dev.txt
      - name: Check backend
        working-directory: backend
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          ruff check .
          ruff format --check .
          python -m compileall app
          python -m pytest

      - name: Validate launchers and Compose files
        shell: bash
        run: |
          set -euo pipefail
          bash -n release/package.sh release/linux/*.sh release/tests/*.sh
          bash release/tests/linux-launcher.test.sh
          MCP_COMPOSER_VERSION="${GITHUB_REF_NAME#v}" \
            docker compose -f compose.release.yaml config --quiet
          MCP_COMPOSER_VERSION="${GITHUB_REF_NAME#v}" \
          MCP_COMPOSER_DOMAIN="composer.example.com" \
          MCP_COMPOSER_USERNAME="composer" \
          MCP_COMPOSER_PASSWORD_HASH='$2a$14$releasevalidationhash' \
            docker compose -f compose.hosted.yaml config --quiet
          pwsh -NoLogo -NoProfile -Command \
            '$files=@("release/windows/start.ps1", "release/tests/windows-launcher.test.ps1", "release/tests/windows-launcher.e2e.ps1"); foreach ($file in $files) { $tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null; if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 } }'
          pwsh -NoLogo -NoProfile -File release/tests/windows-launcher.test.ps1

  publish-image:
    needs:
      - validate
      - container-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Set release version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=MCP Composer
            org.opencontainers.image.description=Compose task-specific MCP gateways from curated upstream tools.
      - name: Build and push multi-platform image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            MCP_COMPOSER_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Attest the published image
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  container-smoke:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build release image
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          docker build \
            --build-arg "MCP_COMPOSER_VERSION=${version}" \
            --tag "mcp-composer:${version}" \
            .
      - name: Build and extract release bundles
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          output="${RUNNER_TEMP}/mcp-composer-e2e-bundles"
          windows_extract="${RUNNER_TEMP}/mcp-composer-e2e-windows"
          linux_extract="${RUNNER_TEMP}/mcp-composer-e2e-linux"
          mkdir -p "${windows_extract}" "${linux_extract}"
          bash release/package.sh "${version}" "${output}"
          unzip -q "${output}/mcp-composer-${version}-windows.zip" -d "${windows_extract}"
          tar -xzf "${output}/mcp-composer-${version}-linux.tar.gz" -C "${linux_extract}"
          {
            printf 'MCP_COMPOSER_E2E_VERSION=%s\n' "${version}"
            printf 'MCP_COMPOSER_E2E_WINDOWS_BUNDLE=%s/mcp-composer-%s-windows\n' "${windows_extract}" "${version}"
            printf 'MCP_COMPOSER_E2E_LINUX_BUNDLE=%s/mcp-composer-%s-linux\n' "${linux_extract}" "${version}"
          } >> "${GITHUB_ENV}"

      - name: Run real Windows launcher E2E
        shell: pwsh
        run: |
          ./release/tests/windows-launcher.e2e.ps1 `
            -BundleDirectory $env:MCP_COMPOSER_E2E_WINDOWS_BUNDLE `
            -Image mcp-composer `
            -Version $env:MCP_COMPOSER_E2E_VERSION `
            -OccupiedPort 8000

      - name: Run real Linux launcher E2E
        shell: bash
        run: |
          export MCP_COMPOSER_E2E_BUNDLE_DIR="${MCP_COMPOSER_E2E_LINUX_BUNDLE}"
          export MCP_COMPOSER_E2E_IMAGE=mcp-composer
          export MCP_COMPOSER_E2E_OCCUPIED_PORT=8000
          bash release/tests/linux-launcher.e2e.sh

  publish-release:
    needs: publish-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Build release bundles
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          output="${RUNNER_TEMP}/mcp-composer-release"
          bash release/package.sh "${version}" "${output}"
          printf 'output=%s\n' "${output}" >> "${GITHUB_ENV}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          assets=(
            "${output}/mcp-composer-${version}-windows.zip"
            "${output}/mcp-composer-${version}-linux.tar.gz"
            "${output}/mcp-composer-${version}-checksums.txt"
          )
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
            gh release edit "${GITHUB_REF_NAME}" \
              --title "MCP Composer ${GITHUB_REF_NAME}" \
              --notes-file release/RELEASE_BODY.md
          else
            flags=(
              --verify-tag
              --title "MCP Composer ${GITHUB_REF_NAME}"
              --notes-file release/RELEASE_BODY.md
            )
            if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" "${flags[@]}"
          fi
