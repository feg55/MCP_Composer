name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.in
            backend/requirements-dev.txt
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m compileall app
      - run: python -m pytest

  container:
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
    steps:
      - uses: actions/checkout@v4
      - name: Validate single-service Compose configuration
        shell: bash
        run: |
          set -euo pipefail
          docker compose config --quiet
          mapfile -t services < <(docker compose config --services)
          test "${#services[@]}" -eq 1
          test "${services[0]}" = "composer"
      - name: Build production image
        run: docker compose build composer
      - name: Smoke test container, hardening, health, and static frontend
        shell: bash
        run: |
          set -euo pipefail
          project_name="mcp-composer-ci"
          export MCP_COMPOSER_PORT=18000
          cleanup() {
            docker compose --project-name "${project_name}" down --remove-orphans \
              >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker compose --project-name "${project_name}" up \
            --no-build \
            --wait \
            --wait-timeout 60 \
            composer

          mapfile -t container_ids < <(
            docker compose --project-name "${project_name}" ps --all --quiet
          )
          test "${#container_ids[@]}" -eq 1
          container_id="${container_ids[0]}"
          test -n "${container_id}"

          test "$(docker inspect --format '{{.State.Health.Status}}' "${container_id}")" = "healthy"
          test "$(docker inspect --format '{{.Config.User}}' "${container_id}")" = "composer"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "${container_id}")" = "true"
          test "$(docker inspect --format '{{.HostConfig.Init}}' "${container_id}")" = "true"
          test "$(docker inspect --format '{{.HostConfig.LogConfig.Type}}' "${container_id}")" = "json-file"
          test "$(docker inspect --format '{{index .HostConfig.LogConfig.Config "max-size"}}' "${container_id}")" = "10m"
          test "$(docker inspect --format '{{index .HostConfig.LogConfig.Config "max-file"}}' "${container_id}")" = "3"
          docker inspect --format '{{json .HostConfig.CapDrop}}' "${container_id}" \
            | grep --fixed-strings '"ALL"'
          docker inspect --format '{{json .HostConfig.Tmpfs}}' "${container_id}" \
            | grep --fixed-strings '"/tmp"'
          docker inspect --format '{{json .HostConfig.SecurityOpt}}' "${container_id}" \
            | grep --fixed-strings 'no-new-privileges'

          curl --fail --silent --show-error http://127.0.0.1:18000/api/health \
            | grep --fixed-strings '"status":"ok"'

          index_html="$(curl --fail --silent --show-error http://127.0.0.1:18000/)"
          printf '%s' "${index_html}" | grep --fixed-strings '<div id="root"></div>'
          curl --fail --silent --show-error --head http://127.0.0.1:18000/ >/dev/null
          asset_path="$(printf '%s' "${index_html}" | grep --only-matching --extended-regexp '/assets/[^"]+\.js' | head -n 1)"
          test -n "${asset_path}"
          curl --fail --silent --show-error "http://127.0.0.1:18000${asset_path}" >/dev/null
