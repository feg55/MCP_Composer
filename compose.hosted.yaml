name: mcp-composer-hosted

services:
  composer:
    image: ${MCP_COMPOSER_IMAGE:-ghcr.io/feg55/mcp-composer}:${MCP_COMPOSER_VERSION:-0.1.0}
    pull_policy: missing
    init: true
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      APP_MODE: hosted
      FRONTEND_DIST_DIR: /app/frontend/dist
      MCP_COMPOSER_VERSION: ${MCP_COMPOSER_VERSION:-0.1.0}
      MCP_COMPOSER_ALLOWED_ORIGINS: https://${MCP_COMPOSER_DOMAIN:?Set MCP_COMPOSER_DOMAIN}
      MCP_COMPOSER_ALLOWED_HOSTS: ${MCP_COMPOSER_DOMAIN:?Set MCP_COMPOSER_DOMAIN},localhost,127.0.0.1
      MCP_COMPOSER_REMOTE_HOSTS: ${MCP_COMPOSER_REMOTE_HOSTS:-}
      MCP_COMPOSER_DOCS_ENABLED: "false"
      MCP_COMPOSER_REQUIRE_ORIGIN: "true"
      MCP_COMPOSER_MAX_REQUEST_BYTES: "1000000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 20s

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      composer:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      MCP_COMPOSER_DOMAIN: ${MCP_COMPOSER_DOMAIN:?Set MCP_COMPOSER_DOMAIN}
      MCP_COMPOSER_USERNAME: ${MCP_COMPOSER_USERNAME:?Set MCP_COMPOSER_USERNAME}
      MCP_COMPOSER_PASSWORD_HASH: ${MCP_COMPOSER_PASSWORD_HASH:?Set MCP_COMPOSER_PASSWORD_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy-data:
  caddy-config:
